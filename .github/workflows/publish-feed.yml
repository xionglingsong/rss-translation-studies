name: Publish RSS feed

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore abstract cache
        uses: actions/cache@v4
        with:
          path: work/abstract-cache.json
          key: abstract-cache-${{ github.run_id }}
          restore-keys: |
            abstract-cache-

      - name: Generate static feed
        run: |
          python server.py --once public/feed.xml
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>RSS Feed</title><p><a href="feed.xml">RSS feed</a></p>' > public/index.html
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
